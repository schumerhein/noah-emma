<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>{{TITEL}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
/*
  TikTok 1080×1920. Scènes worden door scripts/maak.mjs gevuld; elke scène krijgt
  --in / --out (seconden). Harde cuts, tekst verschijnt woord voor woord.
  Veilige zone: TikTok legt bovenin tabs, rechts de knoppen en onderin het
  bijschrift over de video — daarom de ruime padding rechts en onder.
*/
@property --n { syntax: "<integer>"; inherits: false; initial-value: 0; }
:root {
  --roze: #ffb8c4; --roze-d: #f793ab; --roze-l: #fff2f5;
  --blauw: #7fb5e8; --tekst: #0f172a; --sub: #475569;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
#v { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Inter, Arial, sans-serif; color: var(--tekst); }

.scene {
  position: absolute; inset: 0;
  padding: 230px 150px 460px 90px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 64px; text-align: center;
  opacity: 0;
  animation: cutIn .12s ease-out var(--in) both, cutUit .01s linear var(--out) forwards;
}
@keyframes cutIn  { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: none; } }
@keyframes cutUit { to { opacity: 0; } }

/* Achtergronden */
.bg-roze    { background: linear-gradient(170deg, #fff7f9 0%, #ffe1e8 100%); }
.bg-wit     { background: #fff; }
.bg-felroze { background: var(--roze); }
.bg-donker  { background: var(--tekst); color: #fff; }
.blob { position: absolute; border-radius: 50%; opacity: .5; z-index: -1; animation: drift 6s ease-in-out var(--in) both; }
.blob.b1 { width: 900px; height: 900px; background: var(--roze); left: -380px; top: -320px; }
.blob.b2 { width: 700px; height: 700px; background: #ffd3dd; right: -300px; bottom: -200px; animation-direction: reverse; }
.bg-felroze .blob { background: #ffd0da; }
.bg-donker .blob, .bg-wit .blob { display: none; }
.scene { isolation: isolate; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(60px, 50px) scale(1.1); } }

/* Typografie */
h1 { font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 96px; line-height: 1.08; letter-spacing: -.025em; }
h1.klein { font-size: 84px; }
.w { display: inline-block; animation: woord .38s cubic-bezier(.2,1.4,.4,1) calc(var(--in) + .1s + var(--i) * .11s) both; }
@keyframes woord { from { opacity: 0; transform: translateY(36px) scale(.85); } to { opacity: 1; transform: none; } }
em { font-style: normal; color: var(--roze-d); }
.bg-donker em { color: var(--roze); }
.bg-felroze h1 { line-height: 1.3; }
.bg-felroze em { color: #fff; background: var(--tekst); padding: 0 .14em; border-radius: .18em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sub { font-size: 50px; line-height: 1.3; font-weight: 600; color: var(--sub); animation: omhoog .45s cubic-bezier(.2,.8,.2,1) calc(var(--in) + var(--na)) both; }
.bg-donker .sub { color: #cbd5e1; }
.bg-felroze .sub { color: #3b1d26; }
.kicker {
  font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 44px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--tekst); color: #fff; padding: 14px 34px; border-radius: 999px;
  animation: pop .4s cubic-bezier(.3,1.6,.5,1) var(--in) both;
}
.bg-donker .kicker { background: var(--roze); color: var(--tekst); }
@keyframes omhoog { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.3) rotate(var(--r, 0deg)); } to { opacity: 1; transform: scale(1) rotate(var(--r, 0deg)); } }

/* Visuals */
.kleding { position: relative; width: 760px; height: 520px; }
.kleding svg { position: absolute; width: 300px; height: auto; filter: drop-shadow(0 14px 18px rgba(15,23,42,.12));
  animation: val .6s cubic-bezier(.3,1.3,.5,1) calc(var(--in) + var(--d)) both; }
@keyframes val { from { opacity: 0; transform: translateY(-700px) rotate(calc(var(--r) * -3)); } to { opacity: 1; transform: rotate(var(--r)); } }

.duo { display: flex; align-items: flex-end; gap: 40px; height: 720px; }
.duo svg { height: 100%; width: auto; transform-origin: 50% 100%; }
.duo .noah { animation: spring .7s cubic-bezier(.3,1.5,.5,1) calc(var(--in) + .1s) both, wiebel 1.1s ease-in-out calc(var(--in) + .8s) infinite alternate; }
.duo .emma { animation: spring .7s cubic-bezier(.3,1.5,.5,1) calc(var(--in) + .3s) both, wiebel 1.1s ease-in-out calc(var(--in) + 1s) infinite alternate-reverse; }
@keyframes spring { from { opacity: 0; transform: translateY(70%) scale(.8); } to { opacity: 1; transform: none; } }
@keyframes wiebel { from { rotate: -2.5deg; } to { rotate: 2.5deg; } }

.solo { display: flex; flex-direction: column; align-items: center; gap: 40px; }
.solo svg { height: 760px; width: auto; transform-origin: 50% 100%; animation: spring .7s cubic-bezier(.3,1.5,.5,1) calc(var(--in) + .05s) both, wiebel 1.2s ease-in-out calc(var(--in) + .8s) infinite alternate; }
.ballon {
  position: relative; white-space: nowrap;
  background: #fff; color: var(--tekst); font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 70px;
  padding: 30px 48px; border-radius: 48px; box-shadow: 0 18px 40px rgba(15,23,42,.14);
  transform-origin: 50% 100%; animation: pop .45s cubic-bezier(.3,1.6,.5,1) calc(var(--in) + .5s) both;
}
.ballon::after { content: ""; position: absolute; left: calc(50% - 20px); bottom: -48px; border: 20px solid transparent; border-top: 30px solid #fff; }
.label { font-size: 46px; font-weight: 700; color: var(--sub); background: #fff; padding: 12px 30px; border-radius: 999px; animation: omhoog .4s ease-out calc(var(--in) + .7s) both; }

.groei { display: flex; align-items: flex-end; gap: 0; height: 600px; }
.groei .stap { margin: 0 -18px; }
.groei .stap { display: flex; flex-direction: column; align-items: center; gap: 14px; height: 100%; justify-content: flex-end;
  animation: spring .55s cubic-bezier(.3,1.5,.5,1) calc(var(--in) + .15s + var(--i) * .3s) both; }
.groei svg { height: calc(100% - 70px); width: auto; }
.groei .maat { font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 40px; color: var(--sub); }

.schild svg { width: 460px; height: auto; --r: 0deg; animation: pop .55s cubic-bezier(.3,1.6,.5,1) calc(var(--in) + .1s) both; }
.schild .vink { stroke-dasharray: 60; stroke-dashoffset: 60; animation: vink .45s ease-out calc(var(--in) + .55s) forwards; }
@keyframes vink { to { stroke-dashoffset: 0; } }

.nummer {
  width: 300px; height: 300px; border-radius: 50%; background: var(--roze); color: var(--tekst);
  display: grid; place-items: center; font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 190px; line-height: 1;
  --r: -8deg; animation: pop .5s cubic-bezier(.3,1.6,.5,1) var(--in) both;
}
.bg-felroze .nummer { background: #fff; }
.bg-donker .nummer { background: var(--roze); }

.teller { font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 420px; line-height: .9; color: var(--roze-d); letter-spacing: -.04em; }
.teller::before { counter-reset: n var(--n); content: counter(n); animation: tel 1.2s cubic-bezier(.2,.7,.3,1) calc(var(--in) + .1s) both; }
@keyframes tel { from { --n: 0; } to { --n: var(--doel); } }
.eenheid { font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 110px; margin-top: -30px; animation: omhoog .4s ease-out calc(var(--in) + 1.1s) both; }

.gezichten { display: flex; }
.gezichten svg { width: 330px; height: auto; border-radius: 50%; border: 12px solid #fff; box-shadow: 0 20px 44px rgba(15,23,42,.16); }
.gezichten svg + svg { margin-left: -70px; }
.gezichten .gn { --r: -6deg; animation: pop .5s cubic-bezier(.3,1.6,.5,1) calc(var(--in) + .05s) both; }
.gezichten .ge { --r: 6deg;  animation: pop .5s cubic-bezier(.3,1.6,.5,1) calc(var(--in) + .2s) both; }
.wordmark { font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 120px; letter-spacing: -.03em; line-height: 1; animation: omhoog .45s cubic-bezier(.2,.8,.2,1) calc(var(--in) + .3s) both; }
.pil {
  font-family: Manrope, Arial, sans-serif; font-weight: 800; font-size: 56px; background: var(--tekst); color: #fff;
  padding: 26px 60px; border-radius: 999px; animation: omhoog .45s ease-out calc(var(--in) + .7s) both, puls .7s ease-in-out calc(var(--in) + 1.3s) infinite alternate;
}
@keyframes puls { to { transform: scale(1.06); } }
.t-eind .sub { font-size: 44px; white-space: nowrap; }
.t-eind .tekst-blok { display: flex; flex-direction: column; align-items: center; gap: 26px; }
</style>
</head>
<body>
<div id="v" data-duur="{{DUUR}}">
{{SCENES}}
</div>
</body>
</html>
